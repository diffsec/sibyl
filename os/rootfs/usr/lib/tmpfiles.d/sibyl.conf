# Sibyl state lives under /var, which bootc keeps across upgrades.
d /var/lib/sibyl              0750 sibyl sibyl -
d /var/lib/sibyl/home         0700 sibyl sibyl -
d /var/lib/sibyl/models       0750 sibyl sibyl -
d /var/lib/sibyl/config       0750 sibyl sibyl -
d /var/lib/sibyl/tls          0750 sibyl sibyl -
d /var/lib/sibyl/stacks       0750 sibyl sibyl -
d /var/lib/sibyl/config/llama-swap 0750 sibyl sibyl -
C /var/lib/sibyl/config/llama-swap/config.yaml 0640 sibyl sibyl - /usr/share/sibyl/llama-swap.yaml
# Start the user manager for sibyl at boot, so its Quadlet units run.
f /var/lib/systemd/linger/sibyl 0644 root root -
# Request queue and status file shared by the System API and the host agent.
d /var/lib/sibyl/run                0750 sibyl sibyl -
d /var/lib/sibyl/run/requests       0750 sibyl sibyl -
# The System API writes the llama-swap backend drop-in here. It overrides the
# default in /etc/containers/systemd/users/1001/llama-swap.container.d/.
d /var/lib/sibyl/home/.config                                           0700 sibyl sibyl -
d /var/lib/sibyl/home/.config/containers                                0700 sibyl sibyl -
d /var/lib/sibyl/home/.config/containers/systemd                        0700 sibyl sibyl -
d /var/lib/sibyl/home/.config/containers/systemd/llama-swap.container.d 0700 sibyl sibyl -

# The API key and TLS certificate, readable by sibyl-operators (written at each boot).
d /var/lib/sibyl-operator 0750 root sibyl-operators -
