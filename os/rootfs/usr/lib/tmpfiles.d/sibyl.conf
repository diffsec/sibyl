# Sibyl state lives under /var, which bootc keeps across upgrades.
d /var/lib/sibyl              0750 sibyl sibyl -
d /var/lib/sibyl/home         0700 sibyl sibyl -
d /var/lib/sibyl/models       0750 sibyl sibyl -
d /var/lib/sibyl/config       0750 sibyl sibyl -
d /var/lib/sibyl/tls          0750 sibyl sibyl -
d /var/lib/sibyl/stacks       0750 sibyl sibyl -
C /var/lib/sibyl/config/llama-swap.yaml 0640 sibyl sibyl - /usr/share/sibyl/llama-swap.yaml
# Start the user manager for sibyl at boot, so its Quadlet units run.
f /var/lib/systemd/linger/sibyl 0644 root root -
