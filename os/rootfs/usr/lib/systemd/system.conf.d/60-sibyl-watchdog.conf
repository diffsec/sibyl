# Hardware watchdog. systemd pets /dev/watchdog0 (sp5100_tco on AMD boards,
# iTCO_wdt on Intel). If the kernel locks up, the board resets after 60 s.
# RebootWatchdogSec forces the reset if a reboot itself hangs, for example
# on a GPU driver stuck in uninterruptible sleep.
[Manager]
RuntimeWatchdogSec=60s
RebootWatchdogSec=5min
