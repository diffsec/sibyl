# Sibyl loads only its own table (sibyl.nft starts with "destroy table").
# The stock reload flushes the whole ruleset, which also drops the rules of
# other programs, such as tailscaled. A reload with a bad file in
# /etc/nftables/sibyl.d fails as one transaction and keeps the old rules.
[Service]
ExecStart=
ExecStart=/usr/libexec/sibyl/nft-load
ExecReload=
ExecReload=/usr/sbin/nft -f /etc/sysconfig/nftables.conf
