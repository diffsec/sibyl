name: bootc images

on:
  pull_request:
    paths:
      - 'os/**'
      - 'containers/**'
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/bootc.yml'
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'os/**'
      - 'containers/**'
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/bootc.yml'
  workflow_dispatch:
    inputs:
      iso:
        description: Build the live ISO and run the VM install test (about 45 runner minutes)
        type: boolean
        default: false
      bundle:
        description: Build and push the offline update bundle (about 4 GB)
        type: boolean
        default: false
      variants:
        description: Also build the nvidia and intel host images (untested hardware)
        type: boolean
        default: false

permissions:
  contents: read

# Pull requests cancel stale runs. Pushes to main queue instead, because the
# HIP image takes about an hour to build and a cancel throws that work away.
concurrency:
  group: bootc-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  OWNER: diffsec

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
      push: ${{ steps.tag.outputs.push }}
      variants: ${{ steps.tag.outputs.variants }}
    steps:
      - id: tag
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          ALL_VARIANTS: ${{ inputs.variants }}
        run: |
          # amd builds on every push. nvidia and intel build only for release
          # tags or on request, to save runner minutes: no one tests them yet.
          if [[ "$REF" == refs/tags/v* || "$ALL_VARIANTS" == true ]]; then
            echo 'variants=["amd","nvidia","intel"]' >> "$GITHUB_OUTPUT"
          else
            echo 'variants=["amd"]' >> "$GITHUB_OUTPUT"
          fi
          # One tag for the whole image set, so the OS image's Quadlet units
          # always reference service images from the same build.
          if [[ "$REF" == refs/tags/v* ]]; then
            echo "image_tag=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=sha-${SHA::7}" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$EVENT" == pull_request ]]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Vet and test
        run: |
          go vet ./...
          go test -race ./...

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

  service-images:
    needs: [tag, go]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # inputs: every path whose content goes into the image. An image whose
        # inputs are unchanged is retagged, not rebuilt.
        include:
          - name: sibyl-llama-swap
            context: containers/llama-swap
            file: containers/llama-swap/Containerfile.hip
            suffix: -hip
            inputs: containers/llama-swap
          - name: sibyl-llama-swap
            context: containers/llama-swap
            file: containers/llama-swap/Containerfile.vulkan
            suffix: -vulkan
            inputs: containers/llama-swap
          # NVIDIA: llama.cpp's own CUDA build, plus llama-swap.
          - name: sibyl-llama-swap
            context: containers
            file: containers/llama-swap-cuda/Containerfile
            suffix: -cuda
            inputs: containers/llama-swap-cuda containers/llama-swap/fetch-llama-swap.sh containers/llama-swap/config.yaml
          - name: sibyl-caddy
            context: containers/caddy
            file: containers/caddy/Containerfile
            suffix: ''
            inputs: containers/caddy
          - name: sibyl-system-api
            context: .
            file: containers/system-api/Containerfile
            suffix: ''
            inputs: containers/system-api cmd internal go.mod go.sum
          - name: sibyl-tui
            context: .
            file: containers/tui/Containerfile
            suffix: ''
            inputs: containers/tui cmd internal go.mod go.sum
    env:
      IMAGE: ghcr.io/diffsec/${{ matrix.name }}
      CACHE: ghcr.io/diffsec/sibyl-buildcache:${{ matrix.name }}${{ matrix.suffix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: src
        name: Check for an image built from the same inputs
        env:
          INPUTS: ${{ matrix.inputs }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          read -ra paths <<< "$INPUTS"
          tag="src-$(scripts/ci/input-hash.sh "${paths[@]}")${SUFFIX}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "${IMAGE}:${tag}" > /dev/null 2>&1; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "Reusing ${IMAGE}:${tag}"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
            echo "No image for ${tag}; building"
          fi

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }}
          tags: |
            type=raw,value=${{ needs.tag.outputs.image_tag }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Retag the existing image
        id: retag
        if: steps.src.outputs.hit == 'true' && needs.tag.outputs.push == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          SRC: ${{ steps.src.outputs.tag }}
        run: |
          # The digest does not change, so its keyless signature still applies.
          # An image from before key signing gets its key signature below.
          args=()
          while IFS= read -r t; do
            [ -n "$t" ] && args+=(--tag "$t")
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "${IMAGE}:${SRC}"
          digest="$(docker buildx imagetools inspect "${IMAGE}:${SRC}" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # The ROCm build image is ~25 GB unpacked.
      - name: Free disk space
        if: steps.src.outputs.hit != 'true' && matrix.suffix == '-hip'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/share/boost /usr/local/graalvm /usr/local/.ghcup \
            /usr/local/share/powershell /usr/local/share/chromium \
            /usr/local/lib/node_modules /opt/hostedtoolcache
          sudo docker image prune -af
          df -h /

      - if: steps.src.outputs.hit != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Layer cache in GHCR, not the GitHub Actions cache: the ROCm layers alone
      # exceed the 10 GB per-repository Actions cache limit.
      - id: build
        if: steps.src.outputs.hit != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: ${{ needs.tag.outputs.push == 'true' }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ env.IMAGE }}:${{ steps.src.outputs.tag }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=registry,ref=${{ env.CACHE }}
          cache-to: ${{ needs.tag.outputs.push == 'true' && format('type=registry,ref={0},mode=max,image-manifest=true,oci-mediatypes=true', env.CACHE) || '' }}

      - if: needs.tag.outputs.push == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # The host's signature policy requires the key signature. See
      # scripts/ci/sign.sh.
      - name: Sign image
        if: needs.tag.outputs.push == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest || steps.retag.outputs.digest }}
          SKIP_KEYLESS: ${{ steps.src.outputs.hit == 'true' && '1' || '' }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: scripts/ci/sign.sh "$IMAGE" "$DIGEST"

  os-image:
    needs: [tag, service-images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.tag.outputs.variants) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/sibyl-os
          flavor: |
            latest=false
            suffix=-${{ matrix.variant }}
          tags: |
            type=raw,value=${{ needs.tag.outputs.image_tag }}
            type=raw,value=latest,enable={{is_default_branch}}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: os/Containerfile
          platforms: linux/amd64
          push: ${{ needs.tag.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The MOK key signs the NVIDIA kernel modules (os/variants/nvidia.sh).
          secrets: |
            mok_key=${{ secrets.MOK_PRIVATE_KEY }}
          build-args: |
            GPU_VARIANT=${{ matrix.variant }}
            IMAGE_TAG=${{ needs.tag.outputs.image_tag }}
            SIBYL_VERSION=${{ needs.tag.outputs.image_tag }}
          cache-from: type=registry,ref=ghcr.io/diffsec/sibyl-buildcache:os-${{ matrix.variant }}
          cache-to: ${{ needs.tag.outputs.push == 'true' && format('type=registry,ref=ghcr.io/diffsec/sibyl-buildcache:os-{0},mode=max,image-manifest=true,oci-mediatypes=true', matrix.variant) || '' }}

      - if: needs.tag.outputs.push == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image
        if: needs.tag.outputs.push == 'true'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.OWNER }}/sibyl-os
          DIGEST: ${{ steps.build.outputs.digest }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: scripts/ci/sign.sh "$IMAGE" "$DIGEST"

  # The live USB image: the host image plus a live boot, made into an ISO by
  # image-builder's generic-iso type. The host image is embedded, so the
  # installer works offline. The ISO is pushed to GHCR as an OCI artifact,
  # because it is larger than the 2 GiB limit for release assets.
  iso:
    needs: [tag, os-image]
    # The ISO build and VM test use about 45 runner minutes, so they run only
    # when asked: gh workflow run bootc.yml -f iso=true
    if: needs.tag.outputs.push == 'true' && inputs.iso
    # ubuntu-latest moved to 26.04 on 2026-10-28, and there image-builder
    # fails to mount the runner's container storage ("mount:
    # /run/osbuild/containers/storage: permission denied"). The ISO built on
    # 24.04.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.tag.outputs.variants) }}
    env:
      OS_IMAGE: ghcr.io/diffsec/sibyl-os:${{ needs.tag.outputs.image_tag }}-${{ matrix.variant }}
      ISO_REF: ghcr.io/diffsec/sibyl-iso:${{ needs.tag.outputs.image_tag }}-${{ matrix.variant }}
      IMAGE_BUILDER: ghcr.io/osbuild/image-builder-cli@sha256:37b7c22483b03013f54030094683d8af8a83ee642c2a4dc9a51dcd9a79be6b6f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/share/boost /usr/local/graalvm /usr/local/.ghcup \
            /usr/local/share/powershell /usr/local/share/chromium \
            /usr/local/lib/node_modules /opt/hostedtoolcache
          sudo docker image prune -af
          df -h /

      # The new packages are private until someone makes them public, so the
      # pull of the host image logs in.
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the live image
        run: |
          # podman on the runner dials GHCR's blob host over IPv6 only, and
          # the runner has no IPv6. Docker pulls work, so copy from Docker.
          docker pull -q "$OS_IMAGE"
          sudo podman pull "docker-daemon:$OS_IMAGE"
          sudo podman build --build-arg "OS_IMAGE=$OS_IMAGE" -t localhost/sibyl-live containers/live

      - name: Build the ISO
        run: |
          mkdir -p output
          sudo podman run --rm --privileged \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v "$PWD/output:/output" \
            "$IMAGE_BUILDER" build --output-dir /output \
            --bootc-ref localhost/sibyl-live \
            --bootc-installer-payload-ref "$OS_IMAGE" \
            --bootc-default-fs xfs \
            generic-iso
          iso="$(sudo find output -name '*.iso' -print -quit)"
          sudo mv "$iso" "sibyl-${{ needs.tag.outputs.image_tag }}-${{ matrix.variant }}.iso"
          sha256sum sibyl-*.iso | tee SHA256SUMS
          ls -l sibyl-*.iso

      # Install the ISO into a VM with Secure Boot and a TPM2, then boot the
      # installed disk. Only an ISO that passes is pushed.
      - name: Install test in a VM
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends qemu-system-x86 qemu-utils ovmf swtpm swtpm-tools
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chown "$USER" sibyl-*.iso
          tools/vmtest/install-test.sh sibyl-*.iso "$RUNNER_TEMP/vmtest"

      - name: Keep a failed ISO for debugging
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failed-iso-${{ matrix.variant }}
          path: sibyl-*.iso
          retention-days: 2
          if-no-files-found: ignore

      - name: Keep the VM logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vmtest-logs-${{ matrix.variant }}
          path: ${{ runner.temp }}/vmtest/*.log
          if-no-files-found: ignore

      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2

      - name: Push the ISO
        id: push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$TOKEN" | oras login ghcr.io -u "$ACTOR" --password-stdin
          oras push --artifact-type application/vnd.sibyl.iso \
            --format go-template='{{.digest}}' "$ISO_REF,latest-${{ matrix.variant }}" \
            sibyl-*.iso:application/x-iso9660-image SHA256SUMS:text/plain > digest
          echo "digest=$(cat digest)" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the ISO
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "ghcr.io/diffsec/sibyl-iso@${DIGEST}"

  # The offline update bundle: every image for one tag, as OCI archives, with
  # a manifest that the project key signs. sibyl-update checks it on the host.
  # It is about 4 GB, so it builds only for release tags or on request:
  # gh workflow run bootc.yml -f bundle=true
  bundle:
    needs: [tag, os-image]
    if: needs.tag.outputs.push == 'true' && (inputs.bundle || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.tag.outputs.variants) }}
    env:
      TAG: ${{ needs.tag.outputs.image_tag }}
      VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/share/boost /usr/local/graalvm /usr/local/.ghcup \
            /usr/local/share/powershell /usr/local/share/chromium \
            /usr/local/lib/node_modules /opt/hostedtoolcache
          sudo docker image prune -af
          df -h /

      - name: Build the bundle
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends skopeo
          scripts/bundle/make.sh "$TAG" "$VARIANT" bundle

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the manifest
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign sign-blob --yes --key env://COSIGN_PRIVATE_KEY \
            --new-bundle-format=false --use-signing-config=false \
            --output-signature bundle/manifest.json.sig bundle/manifest.json

      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2

      - name: Push the bundle
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$TOKEN" | oras login ghcr.io -u "$ACTOR" --password-stdin
          cd bundle
          oras push --artifact-type application/vnd.sibyl.bundle \
            "ghcr.io/diffsec/sibyl-bundle:${TAG}-${VARIANT},latest-${VARIANT}" \
            manifest.json manifest.json.sig ./*.oci.tar
