name: clean up old images

# Deletes old image versions from GHCR, so storage does not grow without
# bound. It keeps:
#  - every image from the last 14 days;
#  - of older images, the newest builds per package (keep below);
#  - every release (0.1.0, 0.1.0-amd, ...) and every latest tag.
# A host that is more than this behind cannot pull an image that it has not
# pulled before, such as the other llama-swap backend.
#
# The workflow needs the Admin role on each package: Package settings,
# Manage Actions access. Run it by hand with dry_run first.

on:
  schedule:
    - cron: '41 4 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only log what would be deleted
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # keep: builds to keep times the tagged images that each build makes.
          - package: sibyl-os
            keep: 30 # amd on every push, nvidia and intel on releases
          - package: sibyl-llama-swap
            keep: 30 # hip, vulkan and cuda
          - package: sibyl-caddy
            keep: 10
          - package: sibyl-system-api
            keep: 10
          - package: sibyl-router
            keep: 10
          - package: sibyl-tui
            keep: 10
          - package: sibyl-iso
            keep: 3
          - package: sibyl-bundle
            keep: 3
    steps:
      # The ISO and the bundle exist only after an opt-in build, and the
      # router only after its first build.
      - name: Check that the package exists
        id: exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE: ${{ matrix.package }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if gh api "/orgs/${OWNER}/packages/container/${PACKAGE}" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No package ${PACKAGE} yet; nothing to clean."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.exists.outputs.found == 'true'
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: ${{ matrix.package }}
          keep-n-tagged: ${{ matrix.keep }}
          older-than: 14 days
          exclude-tags: '^latest.*$|^[0-9]+\.[0-9]+\.[0-9]+.*$'
          use-regex: true
          delete-untagged: true
          delete-orphaned-images: true
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
