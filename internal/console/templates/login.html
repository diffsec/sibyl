{{define "title"}}Sign in{{end}}
{{define "content"}}
<section class="card narrow">
  <h1>Sign in</h1>
  <p class="muted">Use the password of a host account in the wheel group, such as the admin account from the install.</p>
  {{if .Error}}<p class="error" role="alert">{{.Error}}</p>{{end}}
  <form method="post" action="/console/login" class="stack">
    <label>User <input name="user" autocomplete="username" required value="{{.Name}}" autofocus></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">Sign in</button>
  </form>
</section>
{{end}}
